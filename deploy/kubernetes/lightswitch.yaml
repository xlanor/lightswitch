---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  name: lightswitch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightswitch
  namespace: lightswitch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lightswitch
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lightswitch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lightswitch
subjects:
  - kind: ServiceAccount
    name: lightswitch
    namespace: lightswitch
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lightswitch
  namespace: lightswitch
  labels:
    app.kubernetes.io/name: lightswitch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lightswitch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightswitch
    spec:
      serviceAccountName: lightswitch
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: lightswitch
          image: lightswitch:latest
          args:
            - --kubernetes
            - --sender=remote
            - --server-url=http://pyroscope.pyroscope.svc:4040
            - --ingest-path=/ingest
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
